  const tabs = document.querySelectorAll('.tab');
  const cols = document.querySelectorAll('.state-col');
  tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const step = tab.dataset.step;
      cols.forEach(col=>{
        if(step==='all'){ col.classList.remove('dim'); }
        else { col.classList.toggle('dim', col.dataset.col!==step); }
      });
      // relance l'animation de typing quand on cible l'étape 1
      if(step==='0'||step==='all'){
        const typed=document.querySelector('.typed');
        if(typed){typed.style.animation='none';void typed.offsetWidth;typed.style.animation='';}
      }
    });
  });

</style>

<script>
  const tabs=document.querySelectorAll('.tab');
  const states=document.querySelectorAll('.state');
  function go(i){
    tabs.forEach((t,k)=>t.classList.toggle('active',k==i));
    states.forEach(s=>{
      const on=+s.dataset.state===i;
      s.classList.toggle('show',on);
    });
  }
  tabs.forEach(t=>t.addEventListener('click',()=>go(+t.dataset.state)));
  // petit cycle auto (démo) — passe d'un état à l'autre toutes les 4s
  let i=0; setInterval(()=>{ i=(i+1)%3; go(i); }, 4200);
</script>

<script>
var t=document.querySelectorAll('.t'),f=document.querySelectorAll('.f');
t.forEach(function(b){b.onclick=function(){var i=+b.dataset.i;t.forEach(function(x){x.classList.remove('on')});f.forEach(function(x){x.classList.remove('on')});b.classList.add('on');f[i].classList.add('on')}});
</script></body></html>
