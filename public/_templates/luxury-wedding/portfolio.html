  <script>
    (function () {
      var C = window.__SITE_CONTENT__ || {};
      function get(p) {
        return p.replace(/\[(\d+)\]/g, '.$1').split('.')
          .reduce(function (o, k) { return o == null ? undefined : o[k]; }, C);
      }
      // Hydrate texts (innerHTML for richtext fields like philosophy)
      var RICH_PATHS = new Set(['philosophy.text']);
      document.querySelectorAll('[data-sg-path]').forEach(function (el) {
        var path = el.getAttribute('data-sg-path');
        var v = get(path);
        if (v == null || typeof v === 'object') return;
        if (RICH_PATHS.has(path)) el.innerHTML = v;
        else el.textContent = v;
      });
      // Hydrate images (img.src or background-image)
      document.querySelectorAll('[data-sg-img]').forEach(function (el) {
        var v = get(el.getAttribute('data-sg-img'));
        if (v == null) return;
        if (el.tagName === 'IMG') el.src = v;
        else el.style.backgroundImage = "url('" + v + "')";
      });
      // Animations: reveal + parallax (GSAP recreation, not 1:1 capture)
      if (window.gsap && window.ScrollTrigger) {
        gsap.registerPlugin(ScrollTrigger);
        gsap.utils.toArray('[data-sg-reveal]').forEach(function (el) {
          gsap.from(el, {
            opacity: 0, y: 40, duration: 0.9, ease: 'power3.out',
            scrollTrigger: { trigger: el, start: 'top 88%', once: true }
          });
        });
        gsap.utils.toArray('[data-sg-parallax]').forEach(function (el) {
          gsap.to(el, {
            yPercent: -15, ease: 'none',
            scrollTrigger: { trigger: el, start: 'top bottom', end: 'bottom top', scrub: true }
          });
        });
        // ROBUSTESSE : recalcule les positions après chargement des images
        window.addEventListener('load', function () { ScrollTrigger.refresh(); });
        setTimeout(function () { ScrollTrigger.refresh(); }, 700);
        // Filet ultime anti-page-blanche
        setTimeout(function () {
          document.querySelectorAll('[data-sg-reveal]').forEach(function (el) {
            if (getComputedStyle(el).opacity === '0') { el.style.opacity = '1'; el.style.transform = 'none'; }
          });
        }, 2200);
      }
    })();
  </script>
