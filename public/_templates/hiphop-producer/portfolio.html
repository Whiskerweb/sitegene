  <!-- ============ HYDRATATION + ANIMATIONS (standard clone-site) ============ -->
  <script>
    (function () {
      var C = window.__SITE_CONTENT__ || {};
      function get(p) {
        return p.replace(/\[(\d+)\]/g, '.$1').split('.')
          .reduce(function (o, k) { return o == null ? undefined : o[k]; }, C);
      }
      document.querySelectorAll('[data-sg-path]').forEach(function (el) {
        var v = get(el.getAttribute('data-sg-path'));
        if (v != null && typeof v !== 'object') el.textContent = v;
      });
      document.querySelectorAll('[data-sg-img]').forEach(function (el) {
        var v = get(el.getAttribute('data-sg-img'));
        if (v == null) return;
        if (el.tagName === 'IMG') el.src = v;
        else el.style.backgroundImage = "url('" + v + "')";
      });
      if (window.gsap && window.ScrollTrigger) {
        gsap.registerPlugin(ScrollTrigger);
        gsap.utils.toArray('[data-sg-reveal]').forEach(function (el) {
          gsap.from(el, { opacity: 0, y: 40, duration: 0.9, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 88%', once: true } });
        });
        gsap.utils.toArray('[data-sg-parallax]').forEach(function (el) {
          gsap.to(el, { yPercent: -15, ease: 'none', scrollTrigger: { trigger: el, start: 'top bottom', end: 'bottom top', scrub: true } });
        });
        window.addEventListener('load', function () { ScrollTrigger.refresh(); });
        setTimeout(function () { ScrollTrigger.refresh(); }, 700);
        setTimeout(function () {
          document.querySelectorAll('[data-sg-reveal]').forEach(function (el) {
            if (getComputedStyle(el).opacity === '0') { el.style.opacity = '1'; el.style.transform = 'none'; }
          });
        }, 2200);
      }
    })();
  </script>
