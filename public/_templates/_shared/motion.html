<!-- ═══ AKYRA MOTION KIT — animations partagées (vanilla, sans dépendance, respecte prefers-reduced-motion) ═══ -->
<style>
  [data-anim]{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);will-change:opacity,transform}
  [data-anim="fade"]{transform:none}
  [data-anim="left"]{transform:translateX(-26px)}
  [data-anim="right"]{transform:translateX(26px)}
  [data-anim="scale"]{transform:scale(.96)}
  [data-anim].in{opacity:1!important;transform:none!important}
  /* Apparition du texte mot à mot */
  .anim-words .w{display:inline-block;opacity:0;transform:translateY(0.5em);transition:opacity .6s ease,transform .6s cubic-bezier(.16,1,.3,1)}
  .anim-words.in .w{opacity:1;transform:none}
  /* Galerie accordéon : au survol, la vignette s'élargit, les autres se rétractent (CSS pur) */
  .gallery-expand{display:flex}
  .gallery-expand>.gx{flex:1 1 0;min-width:0;overflow:hidden;transition:flex-grow .7s cubic-bezier(.16,1,.3,1)}
  .gallery-expand>.gx img{width:100%;height:100%;object-fit:cover}
  @media (hover:hover){
    .gallery-expand:hover>.gx{flex-grow:.6}
    .gallery-expand>.gx:hover{flex-grow:3}
  }
  @media (prefers-reduced-motion:reduce){[data-anim],.anim-words .w{opacity:1!important;transform:none!important;transition:none!important}.gallery-expand>.gx{transition:none}}
</style>
<script>
(function(){
  var RM = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var IO = 'IntersectionObserver' in window;

  // 1) Révélation au scroll des éléments [data-anim] (stagger via data-anim-delay en ms)
  var reveals = document.querySelectorAll('[data-anim]');
  function showReveal(el){
    var d = parseInt(el.getAttribute('data-anim-delay')||'0',10);
    if(d) setTimeout(function(){el.classList.add('in')}, d); else el.classList.add('in');
  }
  if(RM || !IO){ reveals.forEach(function(e){e.classList.add('in')}); }
  else {
    var ioR = new IntersectionObserver(function(es){
      es.forEach(function(en){ if(en.isIntersecting){ showReveal(en.target); ioR.unobserve(en.target);} });
    },{threshold:0.12, rootMargin:'0px 0px -6% 0px'});
    reveals.forEach(function(e){ ioR.observe(e); });
  }

  // 2) Texte mot à mot : <h1 class="anim-words">…</h1>.
  //    Découpe DOM-SAFE : on n'enveloppe QUE les nœuds texte (les balises internes
  //    — dégradés, pilules — sont préservées intactes, jamais transformées en texte).
  document.querySelectorAll('.anim-words').forEach(function(el){
    if(el.dataset.split) return; el.dataset.split='1';
    // Garde-fou : si le titre contient des balises internes (dégradé, pilule…),
    // on NE découpe PAS (sinon dégradé cassé / mots invisibles) — il reste intact.
    if(el.children.length > 0){ el.classList.remove('anim-words'); return; }
    var wi = 0, textNodes = [], walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    while(walker.nextNode()) textNodes.push(walker.currentNode);
    textNodes.forEach(function(tn){
      if(!tn.nodeValue || !tn.nodeValue.trim()) return;
      var frag = document.createDocumentFragment();
      tn.nodeValue.split(/(\s+)/).forEach(function(part){
        if(part === '') return;
        if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return; }
        var s = document.createElement('span'); s.className='w'; s.textContent=part;
        s.style.transitionDelay=((wi++)*45)+'ms'; frag.appendChild(s);
      });
      tn.parentNode.replaceChild(frag, tn);
    });
  });
  if(RM || !IO){ document.querySelectorAll('.anim-words').forEach(function(e){e.classList.add('in')}); }
  else {
    var ioW = new IntersectionObserver(function(es){
      es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); ioW.unobserve(en.target);} });
    },{threshold:0.25});
    document.querySelectorAll('.anim-words').forEach(function(e){ ioW.observe(e); });
  }

  // 3) Compteurs : <span data-count="1200" data-count-suffix="+" data-count-decimals="0">0</span>
  function fmt(v,dec){ return v.toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
  function countUp(el){
    var target=parseFloat(el.getAttribute('data-count'))||0,
        suf=el.getAttribute('data-count-suffix')||'', pre=el.getAttribute('data-count-prefix')||'',
        dec=parseInt(el.getAttribute('data-count-decimals')||'0',10), dur=1500, start=null;
    function step(ts){ if(!start)start=ts; var p=Math.min((ts-start)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent=pre+fmt(target*e,dec)+suf; if(p<1)requestAnimationFrame(step); else el.textContent=pre+fmt(target,dec)+suf; }
    requestAnimationFrame(step);
  }
  var nums = document.querySelectorAll('[data-count]');
  if(RM || !IO){ nums.forEach(function(el){ el.textContent=(el.getAttribute('data-count-prefix')||'')+fmt(parseFloat(el.getAttribute('data-count'))||0,parseInt(el.getAttribute('data-count-decimals')||'0',10))+(el.getAttribute('data-count-suffix')||''); }); }
  else {
    var ioN = new IntersectionObserver(function(es){
      es.forEach(function(en){ if(en.isIntersecting){ countUp(en.target); ioN.unobserve(en.target);} });
    },{threshold:0.6});
    nums.forEach(function(el){ ioN.observe(el); });
  }
})();
</script>
