<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only"></head>
<body style="margin:0;padding:0;background:#f5f4f8;">
  <span style="display:none;max-height:0;overflow:hidden;opacity:0;">Votre code de vérification Akyra.</span>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f4f8;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #ececf1;border-radius:16px;overflow:hidden;">
        <tr><td style="padding:26px 32px 8px;">
          <img src="https://akyra.io/brand/akyra-light.png" width="30" height="30" alt="Akyra" style="vertical-align:middle;display:inline-block;border:0;outline:none;text-decoration:none;">
          <span style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;color:#0c0a14;letter-spacing:-0.02em;vertical-align:middle;margin-left:9px;">Akyra</span>
        </td></tr>
        <tr><td style="padding:8px 32px 4px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#26242e;">
          <p style="margin:0 0 14px;"><strong>Votre code de vérification</strong></p>
          <p style="margin:0 0 14px;">Saisissez ce code pour confirmer votre identité :</p>
          <div style="margin:24px 0;padding:18px 0;text-align:center;background:#f5f4f8;border:1px solid #ececf1;border-radius:12px;">
            <span style="font-family:'Courier New',monospace;font-size:30px;font-weight:700;letter-spacing:8px;color:#0c0a14;">{{ .Token }}</span>
          </div>
          <p style="margin:0;font-size:13px;color:#6b6878;">Ce code expire rapidement. Ne le partagez avec personne.</p>
        </td></tr>
        <tr><td style="padding:24px 32px 32px;border-top:1px solid #ececf1;">
          <p style="margin:0;font-size:12px;color:#6b6878;font-family:Arial,Helvetica,sans-serif;">Akyra · akyra.io</p>
          <p style="margin:6px 0 0;font-size:12px;color:#6b6878;font-family:Arial,Helvetica,sans-serif;">Vous n'avez rien demandé ? Ignorez cet email.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
